<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="unical-architecture-title unical-architecture-desc">
      <title id="unical-architecture-title">Direct subscribe vs unical</title>
      <desc id="unical-architecture-desc">Upper flow: a calendar app connects to Madrid, then a second subscribe toward Berlin is cut mid-path by a paywall. Lower flow: the same app gets both ICS feeds through one unical URL.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
                <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="stop" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><rect x="2" y="0" width="4" height="8" fill="#2d3142"/></marker>
      </defs>

